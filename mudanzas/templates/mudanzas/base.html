{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}La Selva Mudanzas{% endblock %}</title>
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <meta name="theme-color" content="#2f6f4f">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/alpine.min.js' %}" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'mudanzas:list' %}">La Selva Mudanzas</a>
        <span id="estado-conexion" class="badge" data-offline-indicator>...</span>
    </header>

    <main class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="message message--{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/offline.js' %}" defer></script>
</body>
</html>
